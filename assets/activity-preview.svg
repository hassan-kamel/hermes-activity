<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Activity page preview</title>
  <desc id="desc">Illustrative Hermes Activity dashboard with sample data. No real user analytics are shown.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
    <pattern id="emptyCells" width="17" height="18" patternUnits="userSpaceOnUse"><rect width="13" height="13" rx="3" fill="#292733"/></pattern>
    <pattern id="calendar" width="68" height="126" patternUnits="userSpaceOnUse">
      <rect width="68" height="126" fill="url(#emptyCells)"/>
      <rect x="0" y="0" width="13" height="13" rx="3" fill="#574e85"/><rect x="34" y="0" width="13" height="13" rx="3" fill="#7769bb"/>
      <rect x="17" y="18" width="13" height="13" rx="3" fill="#574e85"/><rect x="51" y="18" width="13" height="13" rx="3" fill="#9b88ed"/>
      <rect x="34" y="36" width="13" height="13" rx="3" fill="#574e85"/><rect x="51" y="36" width="13" height="13" rx="3" fill="#7769bb"/>
      <rect x="0" y="54" width="13" height="13" rx="3" fill="#7769bb"/><rect x="34" y="54" width="13" height="13" rx="3" fill="#c2b2ff"/>
      <rect x="17" y="72" width="13" height="13" rx="3" fill="#574e85"/><rect x="51" y="72" width="13" height="13" rx="3" fill="#7769bb"/>
      <rect x="0" y="90" width="13" height="13" rx="3" fill="#9b88ed"/><rect x="34" y="90" width="13" height="13" rx="3" fill="#574e85"/>
      <rect x="17" y="108" width="13" height="13" rx="3" fill="#7769bb"/><rect x="51" y="108" width="13" height="13" rx="3" fill="#574e85"/>
    </pattern>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e9e7f1; }
      .muted { fill: #9692a6; }
      .small { font-size: 13px; }
      .label { font-size: 12px; letter-spacing: 1.5px; fill: #9692a6; font-weight: 600; }
      .rule { stroke: #34313f; stroke-width: 1; }
      .cell0 { fill: #292733; }
      .cell1 { fill: #574e85; }
      .cell2 { fill: #7769bb; }
      .cell3 { fill: #9b88ed; }
      .cell4 { fill: #c2b2ff; }
    </style>
  </defs>
  <rect width="1440" height="960" rx="18" fill="#17151f"/>
  <rect x="0" y="0" width="1440" height="8" rx="4" fill="url(#accent)" opacity=".85"/>
  <g transform="translate(52 46)">
    <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
      <path d="M4 28V18 M15 28V10 M26 28V2"/>
    </g>
    <text x="44" y="24" font-size="27" font-weight="650">Activity</text>
    <text x="0" y="53" class="muted" font-size="14">Last 12 months · Sample data</text>
    <g transform="translate(1000 0)">
      <rect width="330" height="38" rx="9" fill="#282533" stroke="#393545"/>
      <rect x="196" y="3" width="62" height="32" rx="7" fill="#17151f" stroke="#574e85"/>
      <text x="22" y="25" class="muted small">30d</text><text x="91" y="25" class="muted small">90d</text>
      <text x="209" y="25" font-size="13">12m</text><text x="278" y="25" class="muted small">2026</text>
    </g>
  </g>

  <!-- Overview -->
  <g transform="translate(52 145)">
    <g>
      <text class="label">TOTAL TOKENS</text><text y="38" font-size="29" font-weight="650">8.4M</text><text y="63" class="muted small">including cache</text>
    </g>
    <g transform="translate(342)">
      <text class="label">INPUT</text><text y="38" font-size="29" font-weight="650">1.6M</text><text y="63" class="muted small">1.1M cache read</text>
    </g>
    <g transform="translate(684)">
      <text class="label">OUTPUT</text><text y="38" font-size="29" font-weight="650">420K</text><text y="63" class="muted small">96K reasoning</text>
    </g>
    <g transform="translate(1026)">
      <text class="label">MOST USED MODEL</text><text y="38" font-size="20" font-weight="600">Model A</text><text y="63" class="muted small">34% of recorded tokens</text>
    </g>
    <g transform="translate(0 105)">
      <text class="label">SESSIONS</text><text y="38" font-size="29" font-weight="650">84</text><text y="63" class="muted small">12 subagent sessions</text>
    </g>
    <g transform="translate(342 105)">
      <text class="label">TOOL CALLS</text><text y="38" font-size="29" font-weight="650">1.2K</text><text y="63" class="muted small">across the selected range</text>
    </g>
    <g transform="translate(684 105)">
      <text class="label">ESTIMATED COST</text><text y="38" font-size="29" font-weight="650">$4.80</text><text y="63" class="muted small">some usage may be unpriced</text>
    </g>
    <g transform="translate(1026 105)">
      <text class="label">STREAK</text><text y="38" font-size="29" font-weight="650">4 days</text><text y="63" class="muted small">longest: 9 days</text>
    </g>
  </g>
  <line x1="52" y1="340" x2="1388" y2="340" class="rule"/>

  <!-- Contribution grid -->
  <g transform="translate(52 376)">
    <text font-size="16" font-weight="600">8.4M tokens in the last year</text>
    <g transform="translate(1040 -12)">
      <rect width="296" height="36" rx="8" fill="#282533" stroke="#393545"/>
      <rect x="4" y="3" width="68" height="30" rx="6" fill="#17151f" stroke="#574e85"/>
      <text x="20" y="24" font-size="13">Tokens</text><text x="96" y="24" class="muted small">Sessions</text>
      <text x="183" y="24" class="muted small">Messages</text>
    </g>
    <g class="muted small">
      <text x="34" y="59">Jan</text><text x="107" y="59">Feb</text><text x="181" y="59">Mar</text><text x="255" y="59">Apr</text>
      <text x="329" y="59">May</text><text x="403" y="59">Jun</text><text x="477" y="59">Jul</text><text x="551" y="59">Aug</text>
      <text x="625" y="59">Sep</text><text x="699" y="59">Oct</text><text x="773" y="59">Nov</text><text x="847" y="59">Dec</text>
      <text x="0" y="91">Mon</text><text x="0" y="131">Wed</text><text x="0" y="171">Fri</text>
    </g>
    <rect x="34" y="72" width="884" height="126" fill="url(#calendar)"/>
    <text y="220" class="muted small">Select a day to explore its sessions · local time, by session start</text>
    <g transform="translate(1158 211)">
      <text class="muted small">Less</text>
      <rect x="41" y="-12" width="14" height="14" rx="3" class="cell0"/><rect x="62" y="-12" width="14" height="14" rx="3" class="cell1"/>
      <rect x="83" y="-12" width="14" height="14" rx="3" class="cell2"/><rect x="104" y="-12" width="14" height="14" rx="3" class="cell3"/>
      <rect x="125" y="-12" width="14" height="14" rx="3" class="cell4"/><text x="147" class="muted small">More</text>
    </g>
  </g>

  <line x1="52" y1="626" x2="1388" y2="626" class="rule"/>
  <!-- Token mix -->
  <g transform="translate(52 666)">
    <text class="label">TOKEN MIX</text>
    <rect y="22" width="600" height="10" rx="5" fill="#292733"/>
    <rect y="22" width="114" height="10" rx="5" fill="#8b7cff"/><rect x="114" y="22" width="30" height="10" fill="#c2b2ff"/>
    <rect x="144" y="22" width="74" height="10" fill="#8b7cff" opacity=".48"/><rect x="218" y="22" width="382" height="10" rx="5" fill="#777483"/>
    <g class="small">
      <circle cy="61" r="5" fill="#8b7cff"/><text x="15" y="66">Input</text><text x="600" y="66" text-anchor="end" class="muted">1.6M · 19%</text>
      <circle cy="91" r="5" fill="#c2b2ff"/><text x="15" y="96">Output</text><text x="600" y="96" text-anchor="end" class="muted">420K · 5%</text>
      <circle cy="121" r="5" fill="#a48ff0"/><text x="15" y="126">Reasoning</text><text x="600" y="126" text-anchor="end" class="muted">96K · 1%</text>
      <circle cy="151" r="5" fill="#777483"/><text x="15" y="156">Cache read</text><text x="600" y="156" text-anchor="end" class="muted">6.2M · 74%</text>
    </g>
  </g>
  <!-- Model list -->
  <g transform="translate(740 666)">
    <text class="label">MODELS</text>
    <g font-size="14">
      <text y="56">Model A</text><text x="590" y="56" text-anchor="end" class="muted">2.9M · 24 sessions</text>
      <text y="88">Model B</text><text x="590" y="88" text-anchor="end" class="muted">2.1M · 18 sessions</text>
      <text y="120">Model C</text><text x="590" y="120" text-anchor="end" class="muted">1.8M · 16 sessions</text>
      <text y="152">Other models</text><text x="590" y="152" text-anchor="end" class="muted">1.6M · 26 sessions</text>
    </g>
  </g>
  <text x="52" y="924" class="muted small">Illustrative preview · sample data only</text>

</svg>
